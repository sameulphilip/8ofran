<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="غفران — حجز موعد هادئ مع أب روحي">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="غفران">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>غفران</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background-color: #050D1C; height: 100%; margin: 0; overflow: hidden; }
    #ghofran-splash-root {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #050D1C;
    }
    #ghofran-splash {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050D1C;
    }
  </style>
</head>
<body>
  <div id="ghofran-splash-root">
    <video id="ghofran-splash" autoplay muted playsinline preload="auto">
      <source src="ghofran_splash.mp4" type="video/mp4">
    </video>
  </div>
  <script>
    (function () {
      var root = document.getElementById('ghofran-splash-root');
      var v = document.getElementById('ghofran-splash');
      if (!v || !root) return;
      v.muted = true;
      var marked = false;
      var markDone = function () {
        if (marked) return;
        marked = true;
        v.setAttribute('data-splash-done', '1');
        try { v.pause(); } catch (e) {}
        tryHide();
      };
      var tryHide = function () {
        if (!marked) return;
        if (document.documentElement.getAttribute('data-flutter-ready') !== '1') {
          return;
        }
        if (root && root.parentNode) root.remove();
      };
      var readyObserver = new MutationObserver(tryHide);
      readyObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-flutter-ready']
      });
      var play = function () { v.play().catch(function () { markDone(); }); };
      play();
      v.addEventListener('canplay', play);
      v.addEventListener('loadeddata', play);
      v.addEventListener('ended', markDone);
      v.addEventListener('error', markDone);
      v.addEventListener('click', markDone);
      setTimeout(markDone, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
