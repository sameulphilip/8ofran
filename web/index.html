<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="غفران — حجز موعد هادئ مع أب روحي">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="غفران">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>غفران</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background-color: #050D1C; height: 100%; margin: 0; overflow: hidden; }
    #ghofran-splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050D1C;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <video id="ghofran-splash" autoplay muted playsinline preload="auto">
    <source src="ghofran_splash.mp4" type="video/mp4">
  </video>
  <script>
    (function () {
      var v = document.getElementById('ghofran-splash');
      if (!v) return;
      v.muted = true;
      var gone = false;
      var hide = function () {
        if (gone || !v.parentNode) return;
        gone = true;
        v.remove();
      };
      var play = function () { v.play().catch(function () { hide(); }); };
      play();
      v.addEventListener('canplay', play);
      v.addEventListener('loadeddata', play);
      v.addEventListener('ended', hide);
      v.addEventListener('error', hide);
      v.addEventListener('click', hide);
      setTimeout(hide, 8000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
